<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Paint Mountain 공유 UI 컴포넌트 시스템</title>
  <desc id="desc">완전한 0에서 100 점수 축, 아이콘 기반 지표, 공 큐, 값 스테퍼, 액션, 스테이지 레일을 보여 주는 사양도</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172538" stop-opacity="0"/>
      <stop offset="1" stop-color="#172538" stop-opacity=".78"/>
    </linearGradient>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; fill: #172538; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: .08em; fill: #52647a; }
      .value { font-size: 34px; font-weight: 700; }
      .small { font-size: 16px; font-weight: 600; }
      .axis { font-size: 15px; font-weight: 700; }
      .line { fill: none; stroke: #172538; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .quiet { fill: none; stroke: #8ca0b8; stroke-width: 2; }
      .rule { stroke: #b7c9dc; stroke-width: 1; stroke-dasharray: 4 8; }
      .blue { fill: #2584ff; stroke: #2584ff; }
      .white-line { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#fffdfc"/>
  <rect width="1600" height="112" fill="url(#sky)"/>
  <text x="64" y="52" font-size="28" font-weight="800">공유 컴포넌트만 사용</text>
  <text x="64" y="82" font-size="17" font-weight="600" fill="#52647a">화면은 값과 배치만 제공 · 색·글꼴·선·상태·아이콘은 컴포넌트가 소유</text>
  <text x="1536" y="66" text-anchor="end" font-size="18" font-weight="800" fill="#2584ff">DIRECT OVERLAY / NO PANEL</text>

  <line x1="64" y1="356" x2="1536" y2="356" class="rule"/>
  <line x1="540" y1="146" x2="540" y2="326" class="rule"/>
  <line x1="1050" y1="146" x2="1050" y2="326" class="rule"/>
  <line x1="760" y1="394" x2="760" y2="708" class="rule"/>

  <!-- ScoreScale -->
  <text x="64" y="158" class="label">SCORE SCALE</text>
  <text x="64" y="189" class="small">LIVE는 수직 0–100 · 목표 구간만 색으로 표시</text>
  <line x1="108" y1="212" x2="108" y2="326" stroke="#8ca0b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="108" y1="313" x2="108" y2="318" stroke="#2584ff" stroke-width="10" stroke-linecap="round"/>
  <g class="axis">
    <line x1="96" y1="212" x2="120" y2="212" class="line"/><text x="132" y="217">100</text>
    <line x1="99" y1="240" x2="117" y2="240" class="quiet"/><text x="132" y="245">75</text>
    <line x1="99" y1="269" x2="117" y2="269" class="quiet"/><text x="132" y="274">50</text>
    <line x1="99" y1="297" x2="117" y2="297" class="quiet"/><text x="132" y="302">25</text>
    <line x1="96" y1="326" x2="120" y2="326" class="line"/><text x="132" y="331">0</text>
  </g>
  <circle cx="108" cy="326" r="8" fill="#fffdfc" stroke="#2584ff" stroke-width="4"/>
  <text x="244" y="221" class="label">BRIEF / RESULT</text>
  <line x1="244" y1="259" x2="474" y2="259" stroke="#8ca0b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="261" y1="259" x2="270" y2="259" stroke="#2584ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="244" y1="249" x2="244" y2="269" class="line"/><text x="244" y="294" text-anchor="middle" class="axis">0</text>
  <line x1="474" y1="249" x2="474" y2="269" class="line"/><text x="474" y="294" text-anchor="middle" class="axis">100</text>
  <text x="244" y="323" class="small" fill="#52647a">같은 컴포넌트 · orientation preset만 변경</text>

  <!-- Metric + BallQueue -->
  <text x="582" y="158" class="label">METRIC · BALL QUEUE</text>
  <g transform="translate(584 212)">
    <circle cx="18" cy="18" r="15" class="line"/><path d="M18 9v10l7 4" class="line"/>
    <text x="48" y="29" class="value">00:48</text>
    <path d="M220 8h22M231 1v22" class="line"/><text x="258" y="29" class="value">3</text>
    <circle cx="370" cy="18" r="17" fill="#ef5a54"/><circle cx="420" cy="18" r="17" fill="#ef5a54"/><circle cx="470" cy="18" r="17" fill="#3ca66b"/>
    <circle cx="370" cy="18" r="7" fill="#fff"/><rect x="413" y="11" width="14" height="14" rx="2" fill="#fff" transform="rotate(45 420 18)"/><path d="M470 9l9 7-3 11h-12l-3-11z" fill="#fff"/>
  </g>
  <text x="584" y="299" class="small" fill="#52647a">20/24 px 아이콘 · 색 + 형태로 상태 중복 표현</text>
  <path d="M925 250l18-12v12" fill="#172538"/>
  <rect x="760" y="250" width="183" height="56" rx="9" fill="#172538"/>
  <text x="776" y="274" class="small" fill="#fff">충돌 폭발 · 빨강</text>
  <text x="776" y="295" font-size="13" font-weight="600" fill="#fff">HOVER · FOCUS · PRESS</text>

  <!-- Action -->
  <text x="1094" y="158" class="label">ACTION</text>
  <g transform="translate(1096 196)">
    <circle cx="44" cy="44" r="44" fill="#2584ff"/>
    <path d="M27 44h34M49 31l13 13-13 13" class="white-line"/>
    <text x="106" y="55" class="value">다음</text>
    <path d="M275 30a22 22 0 1 0 7 18M282 29v20h-20" class="line"/>
    <text x="315" y="55" class="small">다시</text>
  </g>
  <text x="1096" y="299" class="small" fill="#52647a">주요 행동 1개만 파랑 · 나머지는 직접 아이콘</text>

  <!-- ValueStepper -->
  <text x="64" y="410" class="label">VALUE STEPPER</text>
  <g transform="translate(64 448)">
    <circle cx="20" cy="20" r="18" class="line"/><circle cx="20" cy="20" r="5" class="line"/><path d="M20 0v8M20 32v8M0 20h8M32 20h8" class="line"/>
    <text x="54" y="28" class="small">각도</text>
    <circle cx="146" cy="20" r="20" class="quiet"/><path d="M137 20h18" class="line"/>
    <text x="210" y="31" class="value" text-anchor="middle">19.5°</text>
    <circle cx="278" cy="20" r="20" class="quiet"/><path d="M269 20h18M278 11v18" class="line"/>
  </g>
  <g transform="translate(64 526)">
    <path d="M4 30l28-20M9 33l-5-7 23-17 5 7z" class="line"/>
    <text x="54" y="28" class="small">파워</text>
    <circle cx="146" cy="20" r="20" class="quiet"/><path d="M137 20h18" class="line"/>
    <text x="210" y="31" class="value" text-anchor="middle">84%</text>
    <circle cx="278" cy="20" r="20" class="quiet"/><path d="M269 20h18M278 11v18" class="line"/>
  </g>
  <text x="64" y="626" class="small" fill="#52647a">아이콘 · 감소 · 값 · 증가의 동일한 4열 구조</text>

  <!-- StageRail -->
  <text x="812" y="410" class="label">STAGE RAIL</text>
  <line x1="838" y1="502" x2="1488" y2="502" stroke="#8ca0b8" stroke-width="3"/>
  <g font-size="17" font-weight="800" text-anchor="middle">
    <circle cx="850" cy="502" r="28" fill="#2584ff"/><text x="850" y="508" fill="#fff">01</text>
    <circle cx="940" cy="502" r="24" fill="#fffdfc" stroke="#172538" stroke-width="3"/><text x="940" y="508">02</text>
    <circle cx="1030" cy="502" r="24" fill="#fffdfc" stroke="#172538" stroke-width="3"/><text x="1030" y="508">03</text>
    <circle cx="1120" cy="502" r="24" fill="#fffdfc" stroke="#172538" stroke-width="3"/><text x="1120" y="508">04</text>
    <circle cx="1210" cy="502" r="24" fill="#fffdfc" stroke="#172538" stroke-width="3"/><text x="1210" y="508">05</text>
    <circle cx="1300" cy="502" r="24" fill="#fffdfc" stroke="#172538" stroke-width="3"/><text x="1300" y="508">06</text>
    <circle cx="1390" cy="502" r="24" fill="#eef1f5" stroke="#8ca0b8" stroke-width="3"/><path d="M1382 501v-7a8 8 0 0 1 16 0v7M1380 501h20v15h-20z" class="line"/>
    <circle cx="1480" cy="502" r="24" fill="#eef1f5" stroke="#8ca0b8" stroke-width="3"/><path d="M1472 501v-7a8 8 0 0 1 16 0v7M1470 501h20v15h-20z" class="line"/>
  </g>
  <text x="812" y="576" class="small" fill="#52647a">카드 대신 한 줄 탐색 · 선택/완료/잠금은 형태로 구분</text>

  <!-- Context hint and scrim -->
  <g transform="translate(812 624)">
    <path d="M0 24h420v72H0z" fill="url(#scrim)" transform="translate(300 -24)"/>
    <path d="M5 5h22v26H5zM9 9h14M16 9v18" class="line"/>
    <text x="42" y="26" class="small">회전</text>
    <path d="M126 5h22v26h-22zM130 9h14M137 9v18" class="line"/>
    <text x="164" y="26" class="small">확대</text>
    <text x="302" y="26" class="label" fill="#fff">CONTRAST SCRIM</text>
    <text x="302" y="54" class="small" fill="#fff">경계가 아니라 대비만 제공</text>
  </g>
</svg>
